name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & validate integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet homeassistant voluptuous requests

      - name: Validate manifest.json
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open("custom_components/solar_of_things/manifest.json"))
          required = ["domain","name","version","config_flow","iot_class","requirements"]
          missing = [k for k in required if k not in m]
          if missing:
              print(f"manifest.json missing keys: {missing}")
              sys.exit(1)
          print(f"manifest.json OK (version={m['version']})")
          PY

      - name: Validate hacs.json
        run: |
          python3 - <<'PY'
          import json, sys
          h = json.load(open("hacs.json"))
          required = ["name","homeassistant"]
          missing = [k for k in required if k not in h]
          if missing:
              print(f"hacs.json missing keys: {missing}")
              sys.exit(1)
          print(f"hacs.json OK (name={h['name']})")
          PY

      - name: Validate strings / translations
        run: |
          python3 - <<'PY'
          import json
          s = json.load(open("custom_components/solar_of_things/strings.json"))
          t = json.load(open("custom_components/solar_of_things/translations/en.json"))
          r = json.load(open("custom_components/solar_of_things/translations/ru.json"))
          print("strings.json OK")
          print("translations/en.json OK")
          print("translations/ru.json OK")
          PY

      - name: Check Python syntax (all .py files)
        run: |
          python3 -m py_compile \
            custom_components/solar_of_things/__init__.py \
            custom_components/solar_of_things/api.py \
            custom_components/solar_of_things/config_flow.py \
            custom_components/solar_of_things/const.py \
            custom_components/solar_of_things/entity.py \
            custom_components/solar_of_things/sensor.py \
            custom_components/solar_of_things/number.py \
            custom_components/solar_of_things/select.py \
            custom_components/solar_of_things/switch.py
          echo "Python syntax OK"

      - name: Run unit tests (if present)
        run: |
          pip install --quiet pytest pytest-asyncio pytest-homeassistant-custom-component || true
          if [ -d tests ]; then
            python3 -m pytest tests/ -v --tb=short || echo "Tests done (failures allowed on CI without HA fixtures)"
          else
            echo "No tests directory found"
          fi
